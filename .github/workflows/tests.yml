name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    # Python 3.9 is not available on the Ubuntu 26.04 image currently behind
    # ubuntu-latest. Keep the oldest supported Python version test on 24.04.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Compile examples
        run: python -m compileall -q examples
